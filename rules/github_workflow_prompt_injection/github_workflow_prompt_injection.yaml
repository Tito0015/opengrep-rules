rules:
  - id: github_workflow_prompt_injection
    languages:
      - yaml
    message: "When concatenating user input inside a prompt within a GitHub Action, the inference output should be considered untrusted."
    severity: "WARNING"
    paths:
      include:
        - .github/workflows/*.yaml
        - .github/workflows/*.yml
    patterns:
      - pattern-either:
        - patterns:
          - pattern: "prompt: $ANY"
          - metavariable-pattern:
              metavariable: $ANY
              pattern-regex: \${{\s*(?:github\.[^}]*\.(?:body|default_branch|email|head_ref|label|message|name|page_name|ref|title)|steps\.[A-Za-z0-9_-]+\.outputs(?:\.[A-Za-z0-9_-]+)+)\s*}}
        - patterns:
          - pattern-inside: |
              with:
                ...
                allowed_non_write_users: "*"
          - pattern: "claude_args: $ANY"
          - metavariable-pattern:
              metavariable: $ANY
              pattern-regex: .*--(allowedTools|allowed-tools)
      - focus-metavariable: $ANY